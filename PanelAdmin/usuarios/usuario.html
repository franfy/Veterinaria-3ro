<!DOCTYPE html>
<html lang="en">
<head>

    <title>Usuarios</title>

<body>
    <div class="tools">
        <div>
            <button class="btnCrear">Crear usuario</button>
        </div>

        <div class="filtro">
            <select title="Filtrar por...">
                <option value="">ID</option>
                <option value="">Cédula</option>
                <option value="">Nombre</option>
                <option value="">Apellido</option>
            </select>
            <form action="" method="post" class="input-box">
                <input name="filtro" type="text" placeholder=" " title="Elemento a filtrar">
                <label>Filtrar por...</label>
                <img src="/media/search.svg">
            </form>
            
        </div>
        
    </div>

                    <th>Nombre</th>
                    <th>Apellido</th>

                    <th>Email</th>
                    <th>Acciones</th>

            </thead>

                    </td>

                    </td>
                </tr>

            </tbody>
        </table>
    </div>

    <form action="" class="alta-usuario">
        <div class="container">

            <!--Contenedor para la cedula-->
            <div class="input-box">
                <input type="text" placeholder=" " title="Campo obligatorio" required>
                <label>Cedula de identidad *</label>
                <img src="/media/id.svg">
            </div>

            <!--Contenedor para el email-->
            <div class="input-box">
                <input type="email" placeholder=" " title="Campo obligatorio" required>
                <label>Email *</label>
                <img src="/media/email.svg">
            </div>

            <!--Contenedor para la contraseña-->
            <div class="input-box">
                <input type="password" placeholder=" " title="Campo obligatorio" required>
                <label>Contraseña *</label>
                <img src="/media/password.svg">
            </div>

            <!--Contenedor para el nombre-->
            <div class="input-box">
                <input type="text" placeholder=" ">
                <label>Nombre</label>
                <img src="/media/name.svg">
            </div>

            <!--Contenedor para el apellido-->
            <div class="input-box">
                <input type="text" placeholder=" ">
                <label>Apellido</label>
                <img src="/media/name.svg">
            </div>

            <!--Contenedor para el telefono-->
            <div class="input-box">
                <input type="text" placeholder=" ">
                <label>Telefono</label>
                <img src="/media/phone.svg">
            </div>
        </div>
    </form>

    <script src="usuario.js"></script>
</body>
</html>
