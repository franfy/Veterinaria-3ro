<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!--CSS-->
    <link rel="stylesheet" href="login.css">
    
    <title>Inicio de sesion</title>
</head>


<!--Cuerpo de la pagina-->
<body>

    <a class="logo" href="/index.html" title="Volver a la pagina principal">
        <img src="/media/logo.png">
    </a>
    
    
    <form action="login.php">

        <div class="container">
            <div class="input-box">
                <input name="inputEmail" type="email" placeholder=" " title="Ingrese su correo electronico para iniciar sesion" required>
                <label>Email</label>
                <img src="/media/email.svg">
            </div>

            <div class="input-box">
                <input name="inputPass" type="password" placeholder=" " title="Ingrese su contraseña para iniciar sesion" required>
                <label>Contraseña</label>
                <img src="/media/password.svg">
            </div>

            
        </div>

        <div>
            <div class="forgot-box">
                <label>Recordar contraseña?</label>
                <input type="checkbox">
            </div>

            <button type="submit">Iniciar sesion</button>

            <p>¿No tienes cuenta? <a href="signIn.html">Registrate</a></p>
        </div>

    </form>

    <script src="login.js"></script>
</body>
</html>
