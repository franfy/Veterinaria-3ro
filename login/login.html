<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!--CSS-->
    <link rel="stylesheet" href="login.css">
    
    <title>Inicio de sesion</title>
</head>


<!--Cuerpo de la pagina-->
<body>

    <!--Contenido principal-->
    <main>

        <!--Contenedor principal, horizontal-->
        <div class="containerHorizontal">
            

            <!--Contenedor de la imagen, vertical-->
            <div class="containerVertical containerSabia" id="containerSabia">
                <a href="/index.html" title="Volver al menu principal">
                    <img class="imgSabia" src="/vet.png">
    
                </a>

                <!--Contenedor del texto-->
                <div class="containerVertical">
                    <h1>Inicie sesion en su cuenta</h1>
                    <p>Ingrese usuario y contraseña para iniciar sesión en su cuenta de la veterinaria</p>
                </div>
            </div>

            <noscript class="containerVertical">
                <h1>¡Actualmente no es posible iniciar sesion!</h1>
                <p>Active JavaScript en su navegador para poder proseguir</p>
            </noscript>

            <!--Contenido para el inicio de sesion-->
            <form class="containerVertical containerLogin" id="containerLogin">

                <!--Contenido para el email-->
                <div class="containerVertical containerInput">
                    <input name="inputEmail" id="inputEmail" type="email" placeholder="Email" required>
                </div>

                <!--Contenido para la contraseña-->
                <div class="containerVertical containerInput">
                    <input name="inputPss" id="inputPass" type="password" placeholder="Contraseña" required>
                </div>

                <div class="containerHorizontal containerBotones">
                    <button id="btnSignin" type="button">Crear cuenta</button>
                    <button id="btnLogin" type="submit">Iniciar sesion</button>
                </div>
                
            </form>

            <!--Entorno aislado para signIn.html y su css-->
            <iframe class="iframeSignin" id="iframeSignin" src="signIn/signIn.html" frameborder="0" width="100%" height="100%"></iframe>

        </div>

    </main>

    <script src="login.js"></script>
</body>
</html>
