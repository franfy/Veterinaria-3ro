<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!--CSS-->
    <link rel="stylesheet" href="login.css">
    
    <title>Inicio de sesion</title>
</head>


<!--Cuerpo de la pagina-->
<body>

    <!--Encabezado de la pagina-->
    <header>
        
    </header>



    <!--Contenido principal-->
    <main>

        <!--Contenido del login-->
        <div class="containerLogin">
            
            <!--Imagen de la veterinaria-->
            <div class="sabiaLogo">
                <a href="/PaginaPrincipal.html" title="Volver a la pagina principal">
                    <img class="sabiaImg" src="Logo.png">
                </a>
                <h1>Accede a tu cuenta</h1>
                <p>Acceder a tu cuenta en la veterinaria</p>
            </div>

            <!--Contenido a mostrar si JavaScript no esta disponible-->
            <noscript>
                <h1>¡Actualmente no es posible iniciar sesion!</h1>
                <p>Active el JavaScript del navegador para poder proseguir</p>
            </noscript>
            
            <!--Formulario del inicio de sesion-->
            <form class="formularioLogin" id="formularioLogin" action="login.php" method="post">
                
                <!--Label y contenido del email-->
                <div class="containerEmail">
                    <input name="inputEmail" id="inputEmail" type="email" placeholder=" " required>
                    <label id="labelEmail" for="inputEmail">Email del usuario</label>
                </div>

                <!--Label y contenido de la contraseña-->
                <div class="containerPass">
                    <input name="inputPass" id="inputPass" type="password" placeholder=" " required>
                    <label id="labelPass" for="inputPass">Contraseña del usuario</label>
                </div>
                
                <!--Resultado tras intentar iniciar sesion y fallar-->
                <p id="resultadoLogin">¡No se ha podido iniciar sesion!</p>

                <!--Contenido de los botones-->
                <div class="containerButtons">
                    <button id="btnSignIn" type="button">Crear cuenta</button>
                    <button id="btnLogIn" type="submit">Iniciar sesion</button>
                </div>
            </form>

            <!--Formulario para el registro del usuario-->
            <div class="divSignIn" id="divSignIn"></div>

        </div>

    </main>



    <!--Pie de pagina-->
    <footer>
        
    </footer>

    <script src="login.js"></script>
</body>
</html>
