  <body>
    <nav class="navbar bg-rojo-sabia">

        <a class="navbar-brand text-white" href="menu.html">

    <section class="bg-primary-subtle p-5" style="height: 69vh">
      <div class="d-flex justify-content-center align-items-center">
        <div class="col-md-3 col-lg-3">
          <div class="card p-4 bg-warning-subtle">
            <h2 class="fw-bold text-center">Iniciar sesión</h2>

            <form action="ingresar.php" method="POST">
              <div class="fw-bold mt-1">
                <label for="usuario">Usuario</label>
                <div class="input-group">
                  <span class="input-group-text"
                    ><span class="material-symbols-outlined">person</span></span
                  >
                  <input
                    class="form-control"
                    type="email"
                    name="usuario"
                    placeholder="Ingresá tu usuario"
                    required
                  />
                </div>
              </div>

              <div class="fw-bold mt-3">
                <label for="password">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"
                    ><span class="material-symbols-outlined">lock</span></span
                  >
                  <input
                    class="form-control"
                    type="password"
                    name="contrasena"
                    placeholder="Ingresá tu contraseña"
                    required
                  />
                </div>
              </div>

              <div class="d-flex justify-content-center mt-4">
                <button class="btn btn-primary fw-bold" type="submit">
                  Ingresar
                </button>
              </div>

              <div class="text-center mt-3">
                <a href="#">¿Olvidaste tu contraseña?</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
